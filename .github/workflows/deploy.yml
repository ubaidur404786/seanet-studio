# publishes the frontend on GitHub Pages (free): https://<owner>.github.io/<repo>/
# the backend is NOT deployed here - Render builds it by itself from render.yaml.
#
# runs when a commit on main changes the frontend, or by hand (Actions tab -> Deploy frontend ->
# Run workflow, or `gh workflow run deploy.yml`), e.g. after changing API_URL.
#
# one-time setup in the GitHub repo:
#   Settings -> Secrets and variables -> Actions -> variable API_URL = the backend address,
#     e.g. https://seanet-studio.onrender.com
#   Settings -> Pages -> Source = "GitHub Actions"
name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    # what GitHub Pages needs: permission to publish, and a token that proves who we are
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # without API_URL the page would call github.io/api, which does not exist
      - name: Check the settings
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::set the repo variable API_URL first (see the top of deploy.yml)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # VITE_API_URL = where the api is. --base = Pages serves the site from /<repo-name>/
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v5
