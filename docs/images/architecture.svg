<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="SEA-Net Studio architecture: train and export once, use the app live, ship on every push">
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #475569; }
    .lane { font-size: 13px; font-weight: 700; letter-spacing: .6px; }
    .when { font-size: 13px; font-weight: 400; letter-spacing: 0; }
    .t { font-size: 15px; font-weight: 700; }
    .ts { font-size: 13.5px; font-weight: 700; }
    .l { font-size: 12.5px; fill: #475569; }
    .ls { font-size: 11.5px; fill: #475569; }
    .tag { font-size: 11px; fill: #64748b; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .box { fill: #fff; stroke: #cbd5e1; stroke-width: 1.2; }
    .arrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1239" height="719" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" class="h1">How SEA-Net Studio works</text>
  <text x="32" y="68" class="sub">Train once, offline  →  answer live, for free  →  update on every push</text>

  <!-- 1. train & export -->
  <rect x="20" y="88" width="1200" height="170" rx="12" fill="#f5f7ff" stroke="#c7d2fe"/>
  <circle cx="44" cy="113" r="12" fill="#4f46e5"/><text x="40" y="117.5" class="num">1</text>
  <text x="64" y="118" class="lane" fill="#3730a3" style="fill:#3730a3">TRAIN &amp; EXPORT <tspan class="when" style="fill:#6366f1">· once, offline</tspan></text>

  <rect x="40" y="136" width="262" height="100" rx="10" class="box"/>
  <text x="56" y="166" class="t">Private research repo</text>
  <text x="56" y="191" class="l">train SEA-Net with PyTorch</text>
  <text x="56" y="212" class="l">one model per domain, 41K weights</text>

  <rect x="336" y="136" width="262" height="100" rx="10" class="box"/>
  <text x="352" y="166" class="t">Export to ONNX</text>
  <text x="352" y="191" class="l">model_export/export_onnx.py</text>
  <text x="352" y="212" class="l">checks ONNX = PyTorch (~1e-5)</text>

  <rect x="632" y="136" width="262" height="100" rx="10" class="box"/>
  <text x="648" y="166" class="t">Check on the full test set</text>
  <text x="648" y="191" class="l">check_test_set · make_samples</text>
  <text x="648" y="212" class="l">same accuracy as in training</text>

  <rect x="928" y="136" width="262" height="100" rx="10" class="box"/>
  <text x="944" y="166" class="t">Model folder per domain</text>
  <text x="944" y="191" class="l">model.onnx · manifest.json</text>
  <text x="944" y="212" class="l">test samples · example CSV files</text>

  <line x1="304" y1="186" x2="333" y2="186" class="arrow"/>
  <line x1="600" y1="186" x2="629" y2="186" class="arrow"/>
  <line x1="896" y1="186" x2="925" y2="186" class="arrow"/>

  <!-- 2. use the app -->
  <rect x="20" y="278" width="1200" height="268" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <circle cx="44" cy="303" r="12" fill="#0d9488"/><text x="40" y="307.5" class="num">2</text>
  <text x="64" y="308" class="lane" style="fill:#115e59">USE THE APP <tspan class="when" style="fill:#0d9488">· every request, live</tspan></text>

  <!-- model folder feeds the backend -->
  <line x1="1000" y1="238" x2="1000" y2="319" class="arrow"/>
  <text x="1010" y="296" class="tag">loaded once at start-up</text>

  <rect x="40" y="330" width="150" height="110" rx="10" class="box"/>
  <text x="56" y="360" class="t">You</text>
  <text x="56" y="384" class="l">pick a domain</text>
  <text x="56" y="404" class="l">+ a series (example,</text>
  <text x="56" y="424" class="l">CSV or pasted)</text>

  <rect x="214" y="330" width="180" height="110" rx="10" class="box"/>
  <text x="230" y="360" class="t">Frontend</text>
  <text x="230" y="384" class="l">React app on</text>
  <text x="230" y="404" class="l">GitHub Pages; its look</text>
  <text x="230" y="424" class="l">comes from the manifest</text>

  <line x1="192" y1="385" x2="211" y2="385" class="arrow"/>

  <!-- backend container -->
  <rect x="456" y="322" width="590" height="200" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="472" y="347" class="ts">Backend · FastAPI in Docker on Render (free)</text>

  <rect x="470" y="362" width="131" height="110" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="482" y="386" class="ts">1. Prepare</text>
  <text x="482" y="408" class="ls">fit to model size</text>
  <text x="482" y="427" class="ls">z-normalise</text>
  <text x="482" y="446" class="ls">long → windows</text>

  <rect x="613" y="362" width="131" height="110" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="625" y="386" class="ts">2. Run SEA-Net</text>
  <text x="625" y="408" class="ls">ONNX Runtime, CPU</text>
  <text x="625" y="427" class="ls">class chances</text>
  <text x="625" y="446" class="ls">+ score per step</text>

  <rect x="756" y="362" width="131" height="110" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="768" y="386" class="ts">3. Evidence</text>
  <text x="768" y="408" class="ls">strongest parts</text>
  <text x="768" y="427" class="ls">of the series</text>
  <text x="768" y="446" class="ls">→ small facts JSON</text>

  <rect x="899" y="362" width="131" height="110" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="911" y="386" class="ts">4. Explain</text>
  <text x="911" y="408" class="ls">facts → LLM text</text>
  <text x="911" y="427" class="ls">template if no LLM</text>
  <text x="911" y="446" class="ls">cache + rate limit</text>

  <line x1="602" y1="417" x2="610" y2="417" class="arrow"/>
  <line x1="745" y1="417" x2="753" y2="417" class="arrow"/>
  <line x1="888" y1="417" x2="896" y2="417" class="arrow"/>

  <text x="472" y="503" class="tag">/api/predict runs steps 1–3  ·  /api/explain runs 1–4 (the model is re-run, never trusted from the browser)</text>

  <!-- frontend <-> backend -->
  <line x1="396" y1="374" x2="453" y2="374" class="arrow"/>
  <text x="402" y="366" class="tag">series</text>
  <line x1="454" y1="404" x2="397" y2="404" class="arrow"/>
  <text x="400" y="421" class="tag">answer,</text>
  <text x="400" y="435" class="tag">evidence,</text>
  <text x="400" y="449" class="tag">text</text>

  <!-- explain <-> llm -->
  <rect x="1072" y="362" width="136" height="110" rx="10" class="box"/>
  <text x="1088" y="386" class="t">Groq LLM</text>
  <text x="1088" y="408" class="l">free API</text>
  <text x="1088" y="427" class="l">sees only the facts,</text>
  <text x="1088" y="446" class="l">not your data</text>
  <line x1="1031" y1="398" x2="1069" y2="398" class="arrow"/>
  <text x="1036" y="390" class="tag">facts</text>
  <line x1="1070" y1="436" x2="1033" y2="436" class="arrow"/>
  <text x="1040" y="455" class="tag">text</text>

  <!-- 3. ship -->
  <rect x="20" y="566" width="1200" height="134" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="44" cy="591" r="12" fill="#d97706"/><text x="40" y="595.5" class="num">3</text>
  <text x="64" y="596" class="lane" style="fill:#92400e">SHIP <tspan class="when" style="fill:#b45309">· on every push to main</tspan></text>

  <rect x="40" y="612" width="262" height="74" rx="10" class="box"/>
  <text x="56" y="641" class="t">git push</text>
  <text x="56" y="665" class="l">new code on GitHub (main)</text>

  <rect x="336" y="612" width="262" height="74" rx="10" class="box"/>
  <text x="352" y="641" class="t">GitHub Actions (CI)</text>
  <text x="352" y="665" class="l">tests · frontend build · Docker build</text>

  <rect x="632" y="612" width="558" height="74" rx="10" class="box"/>
  <text x="648" y="641" class="t">Goes live, both free</text>
  <text x="648" y="665" class="l">Render rebuilds the backend (only after CI passes)  ·  GitHub Pages gets the new frontend</text>

  <line x1="304" y1="649" x2="333" y2="649" class="arrow"/>
  <line x1="600" y1="649" x2="629" y2="649" class="arrow"/>
</svg>
